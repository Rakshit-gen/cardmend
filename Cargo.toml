[package]
name = "cardmend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find the real duplicates in a messy address book, review them card by card, and write one clean vCard file"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
phonenumber = "0.3.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
