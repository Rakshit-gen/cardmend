[package]
name = "cardmend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find the real duplicates in a messy address book, review them card by card, and write one clean vCard file"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
phonenumber = "0.3.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[features]
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:rust-embed"]

[[bin]]
name = "cardmend-web"
path = "src/bin/web.rs"
required-features = ["web"]
